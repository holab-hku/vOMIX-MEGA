[project]
name = "vomix"
version = "0.1.0"
description = "An ultra-fast & modular end-to-end pipeline for terabyte-scale viral metagenomics analysis."
authors = [
    { name="Erfan SHEKARRIZ", email="eshekar@connect.hku.hk" }
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8,<9",
    "rich-click>=1.5,<2",
    "snakemake>=9.23.1,<10",
    "biopython>=1.84",
    "snakemake-executor-plugin-cluster-generic>=1.0.9,<2",
]

[tool.setuptools]
packages = ["vomix", "config", "workflow", "workflow.database", "workflow.envs", "workflow.notebooks", "workflow.rules", "workflow.scripts"]

[tool.setuptools.package-data]
"*" = ["*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
vomix = "vomix.vomix:cli"